name: CI
jobs:
  test:
    name: Test
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
    - name: Install dependencies
      run: go mod download
    - name: Run tests
      run: go test ./... -v -race -count=1
    - name: Check test coverage
      run: go test ./... -coverprofile=coverage.out -covermode=atomic
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: coverage.out
        fail_ci_if_error: false
    timeout-minutes: 6
  security:
    name: Vulnerability scan
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
    - name: go vet
      run: go vet ./...
    - name: govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
    timeout-minutes: 6
  build:
    name: Build
    runs-on: self-hosted
    needs: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
    - name: Build CLI
      run: go build -o grit ./cmd/grit
    - name: Verify binary
      run: ./grit --help
    timeout-minutes: 6
    if: ${{ !cancelled() && (!cancelled()) }}
  build-matrix:
    name: Cross-platform build
    runs-on: self-hosted
    needs: test
    strategy:
      matrix:
        include:
        - goos: linux
          goarch: amd64
          suffix: linux-amd64
        - goos: linux
          goarch: arm64
          suffix: linux-arm64
        - goos: darwin
          goarch: amd64
          suffix: darwin-amd64
        - goos: darwin
          goarch: arm64
          suffix: darwin-arm64
        - goos: windows
          goarch: amd64
          suffix: windows-amd64.exe
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: go build -ldflags="-s -w" -o grit-${{ matrix.suffix }} ./cmd/grit
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: grit-${{ matrix.suffix }}
        path: grit-${{ matrix.suffix }}
        retention-days: 7
    timeout-minutes: 6
    if: ${{ !cancelled() && (!cancelled()) }}
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
